name: Publish to NuGet

on:
  push:
    tags:
      - 'v*' # Trigger on version tags (e.g., v10.5.4)
  workflow_dispatch: # Allow publishing the current main without moving the tag

jobs:
  publish:
    name: Build, Pack & Publish
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write # required: nuget.org exchanges this OIDC token for a temporary API key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.103'

      - name: Build and Pack
        shell: pwsh
        run: ./nupkg/pack.ps1

      # Must run right before the push: the temporary key is valid for one hour and each
      # OIDC token can be exchanged for exactly one key.
      - name: NuGet login (OIDC -> temporary API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }} # nuget.org profile name, not the email address

      - name: Push to NuGet
        shell: pwsh
        run: |
          # pwsh does not expand wildcards for native commands, so hand dotnet nuget push one file at a time.
          $packages = Get-ChildItem -Path nupkg -Filter *.nupkg
          if (-not $packages) { throw "No packages found in nupkg/" }
          Write-Host "Pushing $($packages.Count) packages"
          foreach ($package in $packages) {
            dotnet nuget push $package.FullName --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Push failed for $($package.Name)" }
          }
